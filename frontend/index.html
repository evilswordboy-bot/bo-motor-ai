<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BO MOTOR AI - Predictive Maintenance & Intelligent Fault Detection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            navy: {
              950: '#070A12',
              900: '#0B0F19',
              850: '#0F1626',
              800: '#151F33',
              700: '#1E2D4A',
              600: '#2A3F66'
            },
            cyan: {
              400: '#22D3EE',
              500: '#06B6D4',
              600: '#0891B2'
            },
            purple: {
              400: '#C084FC',
              500: '#A855F7',
              600: '#9333EA'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #070A12;
      color: #E2E8F0;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    /* Custom dark scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0B0F19;
    }
    ::-webkit-scrollbar-thumb {
      background: #1E2D4A;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #2A3F66;
    }
    .glass-card {
      background: linear-gradient(135deg, rgba(15, 22, 38, 0.85) 0%, rgba(11, 15, 25, 0.95) 100%);
      border: 1px solid rgba(42, 63, 102, 0.4);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
    }
    .glass-card-hover:hover {
      border-color: rgba(34, 211, 238, 0.4);
      box-shadow: 0 8px 25px -4px rgba(6, 182, 212, 0.15);
    }
    .glow-cyan {
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.35);
    }
    .glow-purple {
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.35);
    }
    .glow-amber {
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.35);
    }
    .glow-rose {
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.35);
    }
    .glow-emerald {
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.35);
    }
  </style>
</head>
<body class="bg-navy-950 text-slate-100 antialiased min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
